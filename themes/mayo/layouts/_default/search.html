{{ define "head" }}
<!-- Pagefind is generated at build time by build.sh / the deploy workflow.
     The bundle URL is canonified to include the base path, so Pagefind
     auto-detects where to fetch its index from. baseUrl (below) makes the
     result links point into the subpath. -->
<link href="{{ "_pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "_pagefind/pagefind-ui.js" | relURL }}"></script>
{{ end }}

{{ define "main" }}
<div id="search"></div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var ui = new PagefindUI({
    element: '#search',
    // Prepend the site's base path ("" at a domain root, "/sawyerhill.org"
    // under the current Pages subpath) to every result link.
    baseUrl: '{{ (.Site.BaseURL | urls.Parse).Path }}',
    showSubResults: true,
    showImages: false
  });
  // The header search box submits here as ?q=...; feed it into Pagefind.
  var q = new URLSearchParams(window.location.search).get('q');
  if (q) {
    ui.triggerSearch(q);
  }
});
</script>
{{ end }}
