<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="{{ "files/sun2_0.gif" | relURL }}" type="image/gif" />

    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" media="all" href="{{ "files/css/css_UzMyn586wLTNqswid7vIntpmdv1e9sy9EB11qrf32Jo.css" | relURL }}" />
    <link rel="stylesheet" media="all" href="{{ "files/css/css_PblfIxtqwTYJXV9KNMJxGFJornTq7fQJyq7jgeff8fc.css" | relURL }}" />
    {{ block "head" . }}{{ end }}
  </head>
  <body>
    <a href="#main-content" class="visually-hidden focusable skip-link">
      Skip to main content
    </a>

    <div id="page">

      <header id="header" role="banner" aria-label="Site header">
        <div id="header-watermark">

          <div id="site_logo">
            <a href="{{ "" | relURL }}" title="Home" rel="home">
              <img src="{{ "files/logo.png" | relURL }}" alt="Home" />
            </a>
          </div>

          <div id="name-and-slogan">
            <h1 id="site-name">
              <a href="{{ "" | relURL }}" title="Home" rel="home">{{ .Site.Title }}</a>
            </h1>
            <div id="site-slogan">{{ .Site.Params.tagline }}</div>
          </div>

          <div id="header-searchbox">
            <form action="{{ "search/" | relURL }}" method="get" accept-charset="UTF-8">
              <label for="edit-keys" class="visually-hidden">Search</label>
              <input type="search" id="edit-keys" name="q" placeholder="search this site" maxlength="128" class="form-search form-text" />
            </form>
          </div>

        </div> <!-- /#header-watermark -->
      </header>

      <!-- Nav and page title form one band between the header banner and
           the main content. -->
      <div id="navband">
        <nav role="navigation" aria-label="Main navigation">
          <!-- Mobile hamburger toggle. aria-expanded and aria-controls are
               the accessible disclosure pattern; the hidden attribute on
               the button is removed by JS, so without JavaScript there is
               no button and the menu simply stays open. -->
          <button
            type="button"
            class="nav-toggle"
            aria-expanded="false"
            aria-controls="main-menu"
            hidden
          >
            <span class="nav-toggle-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Menu</span>
          </button>
          <ul class="menu-bart" id="main-menu">
            {{ range .Site.Menus.main }}
            <li class="menu-item">
              <a href="{{ .URL | relURL }}">{{ .Name }}</a>
            </li>
            {{ end }}
          </ul>
        </nav>
        <h1 class="title page-title">{{ .Title }}</h1>
      </div>

      <main id="content">
        <a id="main-content"></a>
        <article class="node clearfix">
          {{ block "main" . }}{{ .Content }}{{ end }}
        </article>
      </main>

      <div id="bottom-wrapper">
        <form action="http://lists.sawyerhill.org/mailman/subscribe/interest" method="get">
          <p align="center" style="background-color: #FFFFCC; padding:10px;">Subscribe to our email list (interest @ sawyerhill.org):<br>
          <input name="email" size="20" type="text" value="Your email address">
          <input name="submit" title="Click here to join our interest list" type="submit" value="Join Now"></p>
        </form>
      </div>

    </div> <!-- /#page -->

    <script>
      // Mobile nav toggle. Progressive enhancement: the button starts
      // with the hidden attribute, and the menu starts visible. When JS
      // runs we reveal the button, collapse the menu (via the .js-nav
      // class on <body>), and wire up the toggle. Without JS nothing
      // changes and the menu stays open.
      (function () {
        var toggle = document.querySelector('.nav-toggle');
        if (!toggle) {
          return;
        }
        toggle.hidden = false;
        document.body.classList.add('js-nav');
        toggle.addEventListener('click', function () {
          var expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
        });
      })();
    </script>
  </body>
</html>
