{{- /* Contact form that posts to Formspree. The form ID comes from
     .Site.Params.formspreeFormId (see hugo.toml). The hidden _gotcha field is a
     honeypot: people never see it, spam bots fill it in, Formspree discards
     those submissions. */ -}}
<form class="contact-message-form contact-form" action="https://formspree.io/f/{{ .Site.Params.formspreeFormId }}" method="post">
  <div class="js-form-item form-item js-form-type-textfield form-item-name js-form-item-name">
      <label for="edit-name" class="js-form-required form-required">Your name</label>
        <input type="text" id="edit-name" name="name" value="" size="60" maxlength="255" class="form-text required" required="required" aria-required="true" />

        </div>
<div class="js-form-item form-item js-form-type-email form-item-mail js-form-item-mail">
      <label for="edit-mail" class="js-form-required form-required">Your email address</label>
        <input type="email" id="edit-mail" name="mail" value="" size="60" maxlength="254" class="form-email required" required="required" aria-required="true" />

        </div>
<div class="js-form-item form-item js-form-type-textfield form-item-subject js-form-item-subject">
      <label for="edit-subject" class="js-form-required form-required">Subject</label>
        <input class="js-text-full text-full form-text required" type="text" id="edit-subject" name="subject" value="" size="60" maxlength="100" required="required" aria-required="true" />

  </div>
<div class="js-form-item form-item js-form-type-textarea form-item-message js-form-item-message">
      <label for="edit-message" class="js-form-required form-required">Message</label>
        <div class="form-textarea-wrapper">
  <textarea class="js-text-full text-full form-textarea required resize-vertical" id="edit-message" name="message" rows="12" cols="60" required="required" aria-required="true"></textarea>
 </div>

  </div>
<div class="url-textfield js-form-wrapper form-wrapper" style="display: none !important;">
      <label for="edit-url">Leave this field blank</label>
        <input autocomplete="off" type="text" id="edit-url" name="_gotcha" value="" size="20" maxlength="128" class="form-text" />
</div>
<div class="form-actions js-form-wrapper form-wrapper" id="edit-actions"><input type="submit" id="edit-submit" name="op" value="Send message" class="button button--primary js-form-submit form-submit" />
</div>
</form>
