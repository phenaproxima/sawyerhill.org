# The real baseURL depends on the GitHub repo / Pages URL. Set it before
# deploying. For local preview, `hugo server` overrides this automatically.
baseURL = 'https://example.org/'
title = 'Sawyer Hill EcoVillage'
theme = 'mayo'
# Page bodies are raw HTML lifted from the old Drupal site. Let them through.
[markup.goldmark.renderer]
  unsafe = true

# Main navigation, matching the Drupal menu order and labels.
[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'EcoVillages'
    url = '/ecovillages'
    weight = 2
  [[menu.main]]
    name = 'What is Cohousing?'
    url = '/cohousing'
    weight = 3
  [[menu.main]]
    name = 'Photos'
    url = '/photos'
    weight = 4
  [[menu.main]]
    name = 'Calendar of Events'
    url = '/calendar'
    weight = 5
  [[menu.main]]
    name = 'Homes Available'
    url = '/forsale'
    weight = 6
  [[menu.main]]
    name = 'Contact us'
    url = '/contact'
    weight = 7

[params]
  tagline = 'Two neighborhoods nestled on one beautiful site'
  # Create a form at https://formspree.io with the site owner's email, then
  # paste its ID here (the part after https://formspree.io/f/).
  formspreeFormId = 'YOUR_FORMSPREE_FORM_ID'
