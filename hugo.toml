# Local default. The deploy workflow overrides this with --baseURL for the
# real GitHub Pages URL. canonifyURLs + relURL in templates make links work
# under whatever base path is supplied at build time.
baseURL = 'http://localhost/'
title = 'Sawyer Hill EcoVillage'
theme = 'mayo'
canonifyURLs = true
# Page bodies are raw HTML lifted from the old Drupal site. Let them through.
[markup.goldmark.renderer]
  unsafe = true

# Allow attribute lists ({.class width="..."}) on the line beneath a
# block-level Markdown element, so aligned/sized images don't need raw
# <img> tags. wrapStandAloneImageWithinParagraph puts the attributes on the
# image itself instead of a wrapping <p>.
[markup.goldmark.parser.attribute]
  block = true
  title = true
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Main navigation, matching the Drupal menu order and labels.
[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'EcoVillages'
    url = '/ecovillages'
    weight = 2
  [[menu.main]]
    name = 'What is Cohousing?'
    url = '/cohousing'
    weight = 3
  [[menu.main]]
    name = 'Photos'
    url = '/photos'
    weight = 4
  [[menu.main]]
    name = 'Calendar of Events'
    url = '/calendar'
    weight = 5
  [[menu.main]]
    name = 'Homes Available'
    url = '/forsale'
    weight = 6
  [[menu.main]]
    name = 'Contact us'
    url = '/contact'
    weight = 7

[params]
  tagline = 'Two neighborhoods nestled on one beautiful site'
  # The contact form POSTs to Formspree and does nothing until this is set.
  # Create a form at https://formspree.io with the site owner's email, then
  # paste its ID here (the part after https://formspree.io/f/).
  formspreeFormId = 'YOUR_FORMSPREE_FORM_ID'

# NOTE for anyone editing content/: six images were broken (404) on the old
# live site too. Five were removed during migration (their <img> tags deleted);
# fullsite.jpg was recovered from the live site and now lives in
# content/cohousing/. If an image looks missing, check the page bundle first.

